<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Constryn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,Arial,sans-serif;background:#F3F2EF;color:#1D2226;padding-bottom:70px}
    header{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}
    .logo{font-weight:900;font-size:22px;color:#0A66C2}
    .search{flex:1;background:#EEF3F8;border:none;border-radius:8px;padding:10px 12px;font-size:14px}
    .btn{background:#0A66C2;color:#fff;border:none;padding:9px 16px;border-radius:20px;font-weight:600;font-size:14px;cursor:pointer}
    .btn-outline{background:transparent;border:1px solid #0A66C2;color:#0A66C2}
    .container{max-width:680px;margin:0 auto;padding:12px}
    .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #E0DFDC}
    .post-header{display:flex;gap:10px;margin-bottom:8px}
    .avatar{width:42px;height:42px;border-radius:50%;background:#DCE6F1;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0A66C2}
    .muted{color:#666;font-size:13px}
    nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:30}
    nav.bottom button{background:none;border:none;font-size:11px;color:#666;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
    nav.bottom button.active{color:#0A66C2;font-weight:600}
    .section{display:none}
    .section.active{display:block}
    input,textarea,select{width:100%;padding:11px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
    .auth-box{max-width:380px;margin:30px auto;background:#fff;padding:24px;border-radius:12px}
    .error{color:#c00;font-size:14px;margin-bottom:10px}
    .hidden{display:none}
    .media-preview{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px}
    .pending-item{border:1px solid #eee;padding:12px;margin-bottom:10px;border-radius:8px}
  </style>
</head>
<body>

<header>
  <div class="logo">Constryn</div>
  <input class="search" placeholder="Search..." />
  <div id="header-right"></div>
</header>

<div class="container">

  <div id="auth-section" class="auth-box">
    <h2 id="auth-title">Login</h2>
    <div id="auth-error" class="error"></div>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <input type="text" id="fullname" placeholder="Full Name (for signup)" class="hidden" />
    <button class="btn" style="width:100%;margin-top:8px" onclick="handleAuth()">Continue</button>
    <p style="text-align:center;margin-top:16px;font-size:14px">
      <a href="#" onclick="toggleAuth()" id="toggle-link">Need an account? Sign up</a>
    </p>
  </div>

  <div id="app" class="hidden">

    <div id="home" class="section active">
      <div class="card">
        <h3>Create Post</h3>
        <select id="post-type">
          <option value="Post">Regular Post</option>
          <option value="Project">Building/Engineering Project</option>
          <option value="Product for sale">Product for sale</option>
          <option value="Service">Offer a service</option>
          <option value="Job">Post a Job</option>
        </select>
        <textarea id="content" rows="3" placeholder="What do you want to share?"></textarea>
        <input id="price" placeholder="Price (optional)" />
        <input type="file" id="media-file" accept="image/*,video/*" />
        <img id="preview" class="media-preview hidden" />
        <video id="video-preview" class="media-preview hidden" controls></video>
        <button class="btn" style="margin-top:10px" onclick="createPost()">Publish</button>
      </div>

      <div id="admin-panel" class="card hidden">
        <h3>Admin – Pending Posts</h3>
        <div id="pending-list"></div>
      </div>

      <h3 style="margin:16px 0 10px">Feed</h3>
      <div id="feed"></div>
    </div>

    <div id="discover" class="section">
      <h2>Discover</h2>
      <div class="card"><strong>Trending</strong><p class="muted" style="margin-top:8px">Coming soon</p></div>
    </div>

    <div id="market" class="section">
      <h2>Marketplace</h2>
      <div class="card"><p class="muted">Products will appear here after approval.</p></div>
    </div>

    <div id="messages" class="section">
      <h2>Messages</h2>
      <div id="messages-list" class="card">
        <p class="muted">Your conversations will appear here.</p>
      </div>
    </div>

    <div id="profile" class="section">
      <div class="card" style="text-align:center;padding:24px">
        <div class="avatar" style="width:70px;height:70px;font-size:24px;margin:0 auto 12px" id="profile-avatar">U</div>
        <h2 id="profile-name">User</h2>
        <p class="muted" id="profile-email"></p>
        <button class="btn btn-outline" style="margin-top:12px" onclick="logout()">Logout</button>
      </div>
    </div>

  </div>
</div>

<nav class="bottom hidden" id="bottom-nav">
  <button class="active" onclick="showSection('home', this)"><span>🏠</span>Home</button>
  <button onclick="showSection('discover', this)"><span>🔍</span>Discover</button>
  <button onclick="showSection('market', this)"><span>🛒</span>Market</button>
  <button onclick="showSection('messages', this)"><span>💬</span>Messages</button>
  <button onclick="showSection('profile', this)"><span>👤</span>Profile</button>
</nav>

<script>
  const SUPABASE_URL = 'https://ctdjhtwntccrsophqqjn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0ZGpodHdudGNjcnNvcGhxcWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5OTQ0MTAsImV4cCI6MjEwNDU3MDQxMH0.8FbSAF9PABUaR_uMaNFA3W3cHkp1YoQ6x1jF0bmseNM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let isLogin = true;
  let isAdmin = false;
  let selectedFile = null;

  document.getElementById('media-file').addEventListener('change', function(e) {
    selectedFile = e.target.files[0];
    const preview = document.getElementById('preview');
    const videoPreview = document.getElementById('video-preview');
    preview.classList.add('hidden');
    videoPreview.classList.add('hidden');

    if (!selectedFile) return;

    if (selectedFile.type.startsWith('image/')) {
      preview.src = URL.createObjectURL(selectedFile);
      preview.classList.remove('hidden');
    } else if (selectedFile.type.startsWith('video/')) {
      videoPreview.src = URL.createObjectURL(selectedFile);
      videoPreview.classList.remove('hidden');
    }
  });

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      await ensureProfile();
      showApp();
    }
  }

  async function ensureProfile() {
    const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
    if (!data) {
      await supabase.from('profiles').insert({
        id: currentUser.id,
        full_name: currentUser.user_metadata?.full_name || currentUser.email
      });
    } else {
      isAdmin = data.is_admin === true;
    }
  }

  function toggleAuth() {
    isLogin = !isLogin;
    document.getElementById('auth-title').textContent = isLogin ? 'Login' : 'Sign Up';
    document.getElementById('fullname').classList.toggle('hidden', isLogin);
    document.getElementById('toggle-link').textContent = isLogin ? 'Need an account? Sign up' : 'Already have an account? Login';
    document.getElementById('auth-error').textContent = '';
  }

  async function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('fullname').value.trim();
    const errorEl = document.getElementById('auth-error');
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Please fill email and password';
      return;
    }

    if (isLogin) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { errorEl.textContent = error.message; return; }
      currentUser = data.user;
    } else {
      if (!fullName) { errorEl.textContent = 'Please enter your full name'; return; }
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) { errorEl.textContent = error.message; return; }
      alert('Account created! Please check your email to confirm, then login.');
      isLogin = true;
      toggleAuth();
      return;
    }

    await ensureProfile();
    showApp();
  }

  async function showApp() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');

    const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
    isAdmin = profile?.is_admin === true;

    document.getElementById('header-right').innerHTML = `
      <span style="font-size:13px;margin-right:8px">${profile?.full_name || 'User'}</span>
      <button class="btn btn-outline" onclick="logout()">Logout</button>
    `;

    document.getElementById('profile-name').textContent = profile?.full_name || 'User';
    document.getElementById('profile-email').textContent = currentUser.email;
    document.getElementById('profile-avatar').textContent = (profile?.full_name || 'U').charAt(0).toUpperCase();

    if (isAdmin) {
      document.getElementById('admin-panel').classList.remove('hidden');
      loadPendingPosts();
    }

    loadFeed();
  }

  function showSection(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  async function createPost() {
    const content = document.getElementById('content').value.trim();
    const type = document.getElementById('post-type').value;
    const price = document.getElementById('price').value.trim();

    if (!content) {
      alert('Please write something');
      return;
    }

    let media_url = null;

    if (selectedFile) {
      const fileName = `\( {currentUser.id}/ \){Date.now()}_${selectedFile.name}`;
      const { error: uploadError } = await supabase.storage
        .from('media')
        .upload(fileName, selectedFile);

      if (uploadError) {
        alert('Upload failed: ' + uploadError.message);
        return;
      }

      const { data } = supabase.storage.from('media').getPublicUrl(fileName);
      media_url = data.publicUrl;
    }

    const { error } = await supabase.from('posts').insert({
      user_id: currentUser.id,
      content,
      type,
      price: price || null,
      media_url,
      status: 'pending'
    });

    if (error) {
      alert('Error creating post: ' + error.message);
      return;
    }

    alert('Post submitted for approval!');
    document.getElementById('content').value = '';
    document.getElementById('price').value = '';
    document.getElementById('media-file').value = '';
    selectedFile = null;
    document.getElementById('preview').classList.add('hidden');
    document.getElementById('video-preview').classList.add('hidden');
  }

  async function loadFeed() {
    const { data: posts, error } = await supabase
      .from('posts')
      .select('*, profiles(full_name)')
      .eq('status', 'approved')
      .order('created_at', { ascending: false });

    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (error || !posts || posts.length === 0) {
      feed.innerHTML = '<div class="card"><p class="muted">No posts yet.</p></div>';
      return;
    }

    posts.forEach(post => {
      const name = post.profiles?.full_name || 'User';
      const initial = name.charAt(0).toUpperCase();
      feed.innerHTML += `
        <div class="card">
          <div class="post-header">
            <div class="avatar">${initial}</div>
            <div>
              <strong>${name}</strong><br>
              <span class="muted">${post.type} • ${new Date(post.created_at).toLocaleDateString()}</span>
            </div>
          </div>
          <p>${post.content}</p>
          ${post.price ? `<p><strong>Price:</strong> ${post.price}</p>` : ''}
          ${post.media_url ? (post.media_url.includes('video') || post.media_url.endsWith('.mp4') 
            ? `<video src="${post.media_url}" controls style="max-width:100%;border-radius:8px;margin-top:8px"></video>` 
            : `<img src="${post.media_url}" style="max-width:100%;border-radius:8px;margin-top:8px">`) : ''}
        </div>
      `;
    });
  }

  async function loadPendingPosts() {
    const { data: posts } = await supabase
      .from('posts')
      .select('*, profiles(full_name)')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });

    const list = document.getElementById('pending-list');
    list.innerHTML = '';

    if (!posts || posts.length === 0) {
      list.innerHTML = '<p class="muted">No pending posts</p>';
      return;
    }

    posts.forEach(post => {
      list.innerHTML += `
        <div class="pending-item">
          <strong>${post.profiles?.full_name || 'User'}</strong> – ${post.type}<br>
          <p>${post.content}</p>
          <button class="btn" style="margin-top:8px;margin-right:8px" onclick="approvePost('${post.id}')">Approve</button>
          <button class="btn btn-outline" onclick="rejectPost('${post.id}')">Reject</button>
        </div>
      `;
    });
  }

  async function approvePost(id) {
    await supabase.from('posts').update({ status: 'approved' }).eq('id', id);
    loadPendingPosts();
    loadFeed();
  }

  async function rejectPost(id) {
    await supabase.from('posts').delete().eq('id', id);
    loadPendingPosts();
  }

  async function logout() {
    await supabase.auth.signOut();
    location.reload();
  }

  init();
</script>
</body>
</html>
